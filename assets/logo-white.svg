<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="#ffffff" stroke="none">
    <!-- Left diagonal backslash stroke of the 'X' -->
    <path d="M 120 120 L 190 120 L 290 280 L 220 380 L 120 380 L 230 250 Z" />
    
    <!-- The interlocking 'X' stroke curving into the bold 'C' -->
    <path d="M 230 250 L 120 120 L 190 120 L 275 225 Q 310 120 400 120 Q 450 120 480 150 L 435 200 Q 415 175 385 175 Q 320 175 285 250 Q 320 325 385 325 Q 415 325 435 300 L 480 350 Q 450 380 400 380 Q 310 380 260 290 L 220 380 L 155 380 Z" />

    <!-- The Chess Crown inside the 'C' -->
    <g transform="translate(290, 220) scale(0.65)">
      <!-- Crown points -->
      <polygon points="0,55 25,-10 65,30 105,-10 130,55" fill="#ffffff"/>
      <!-- Crown base -->
      <rect x="10" y="65" width="110" height="12" rx="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
